apiVersion: apps/v1
kind: Deployment
metadata:
    name: myapp-deployment02
    labels:
        app: myapp02
        type: frontend02
spec:
    template:
        metadata:
            name: myapp-pod02
            labels:
                app: myapp02
                type: frontend02
        spec:
            containers:
                - name: nginx-container02
                  image: nginx
    replicas: 2
    selector:
        matchLabels:
            type: frontend02
