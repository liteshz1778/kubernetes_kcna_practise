apiVersion: v1
kind: Pod
metadata:
    name: myapp-pod
    labels:
        app: myapp
        type: frontend
spec:
    containers:
        - name: nginx-container
          image: nginx
    affinity:
        nodeAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 80
                  perference:
                    matchExpressions:
                        - key: size
                          operator: In
                          values:
                            - medium
                        - key: size
                          operator: NotIn
                          values:
                            - large    
