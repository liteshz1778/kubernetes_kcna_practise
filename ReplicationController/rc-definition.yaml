apiVersion: v1
kind: ReplicationController
metadata:
    name: myapp-rc
    labels:
        app: myapp
        type: frontend
spec:
    template:
        metadata:
            name: my-app-pod
            labels:
                app: my-app
                type: frontend
        spec: 
            containers:
                - name: nginx-container
                  image: nginx
              
    replicas: 3       
    selector:
        type: frontend
