apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app-v3
  labels:
    app: myapp
    version: v3
spec: 
  replicas: 2
  selector:
    matchLabels:
      app: myapp
      version: v3
  template:
    metadata:
      name: demo-app-v3-pod
      labels:
        app: myapp
        version: v3
    spec:
      containers:
        - name: demo-app-v3-container
          image: liteshz/httpd_server_files:v3
          ports:
            - containerPort: 80
          env: 
            - name: DEMO_DESCRITION
              value: "This is demo for Canary Deployment"
            - name: APPLICATION_VERSION
              value: v3
---

apiVersion: v1
kind: Service
metadata:
  name: demo-app-v3-svc
spec:
  type: ClusterIP
  selector: 
    app: myapp
    version: v3
  ports:
    - port: 8080
      targetPort: 80

---

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: demo-app-v3-ingress
spec:
  ingressClassName: nginx
  rules:
    - host: "my-demo-svc.com"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: demo-app-v3-svc
                port:
                  number: 8080
