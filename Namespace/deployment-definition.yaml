apiVersion: apps/v1
kind: Deployment
metadata:
    name: myapp-deployment
    labels:
        app: myapp
        type: frontend
    namespace: qa
spec:
    template:
        metadata:
            name: myapp-pod
            labels:
                app: myapp
                type: frontend
        spec: 
            containers:
                - name: nginx-container
                  image: nginx
              
    replicas: 5
    selector:
        matchLabels:
            type: frontend
