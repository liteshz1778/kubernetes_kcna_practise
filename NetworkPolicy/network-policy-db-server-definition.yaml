apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: db-server-netpol
  namespace: qa
spec:
  podSelector:
    matchLabels:
      type: db
  policyTypes:
    - Ingress
  ingress:
    - from:
      - podSelector:
          matchLabels:
            type: backend
    - ports:
      - protocol: TCP
        port: 3000
