apiVersion: apps/v1
kind: Deployment
metadata: 
  name: myapp
  labels:
    app: myapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: myapp
  template:
    metadata:
      name: myapp-pod
      labels:
        app: myapp
    spec:
      containers:
        - name: myapp-container
          image: registry.k8s.io/hpa-example
          ports:
            - containerPort: 80
          env:
            - name: FRSTNAME
              value: Litesh
            - name: LASTNAME
              value: Zadane
          resources:
            limits:
              cpu: 500m
              memory: 200Mi
            requests:
              cpu: 200m
              memory: 100Mi

---

apiVersion: v1
kind: Service
metadata:
  name: myapp-svc
spec: 
  type: NodePort
  selector:
    app: myapp
  ports:
    - port: 8080
      targetPort: 80
      nodePort: 32767
