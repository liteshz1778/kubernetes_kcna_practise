apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql-sts
  labels:
    app: myapp
spec:
  serviceName: "mysql-headless-svc"
  replicas: 2
  selector:
    matchLabels:
      app: myapp
  template:
    metadata:
      name: mysql-sts-pod
      labels:
        app: myapp
    spec:
      containers:
        - name: mysql-sts-container
          image: mysql:latest
          ports:
            - containerPort: 3306
          env:
            - name: "MYSQL_ROOT_PASSWORD"
              value: "lite_root"
