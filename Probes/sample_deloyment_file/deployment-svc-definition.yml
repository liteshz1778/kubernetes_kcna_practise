apiVersion: v1
kind: Namespace
metadata:
  name: qa

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: probes-demo-app
  namespace: qa
  labels:
    app: myapp
spec: 
  replicas: 2
  selector:
    matchLabels:
      app: myapp
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25
      maxUnavailable: 25
  template:
    metadata:
      name: probes-demo-app-pod
      labels:
        app: myapp
    spec:
      containers:
        - name: probes-demo-app-container
          image: liteshz/httpd_server_files:v1
          ports:
            - containerPort: 80
          env: 
            - name: FIRSTNAME
              value: Litesh
            - name: LASTNAME
              value: Zadane
---

apiVersion: v1
kind: Service
metadata:
  name: probes-demo-app-svc
  namespace: qa
spec:
  type: NodePort
  selector: 
    app: myapp
  ports:
    - port: 9090
      targetPort: 80
      nodePort: 32767
