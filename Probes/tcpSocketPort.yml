apiVersion: v1
kind: Pod
metadata:
  name: probe-tcp-socket
  labels:
    app: probe-tcp-socket
spec:
  containers:
    - name: probe-http-container
      image: liteshz/httpd_server_files:v3
      env:
        - name: POD_DESCRIPTION
          value: "This is demo for Probes"
      livenessProbe:
        httpGet:
          path: /health
          port: 80
        initialDelaySeconds: 15
        periodSeconds: 10
        failureThreshold: 3
        successThreshold: 1
      readinessProbe:
        httpGet:
          path: /health
          port: 80
        initialDelaySeconds: 15
        periodSeconds: 10
        failureThreshold: 3
        successThreshold: 1

---

apiVersion: v1
kind: Service
metadata:
  name: probe-tcp-socket-svc
spec:
  type: NodePort
  selector:
    app: probe-tcp-socket
  ports:
    - port: 8080
      targetPort: 80
      nodePort: 32767
